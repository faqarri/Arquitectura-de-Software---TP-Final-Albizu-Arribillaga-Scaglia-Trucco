apiVersion: 1

datasources:
  - name: MySQL Logs
    uid: mysql-logs
    type: mysql
    access: proxy
    url: mysql:3306
    database: comprobantes
    user: grafana
    secureJsonData:
      password: $__env{GRAFANA_DB_PASSWORD}
    jsonData:
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    editable: false
