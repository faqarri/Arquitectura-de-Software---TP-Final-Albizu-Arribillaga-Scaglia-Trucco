global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: comprobantes
    metrics_path: /metrics
    static_configs:
      - targets:
          - comprobantes:8080
  - job_name: reservas
    metrics_path: /metrics
    static_configs:
      - targets:
          - reservas:8080
  # Una serie por instancia (label instance): muestra cómo se reparten las
  # solicitudes y cuál está caída (ADR-012).
  - job_name: catalogo
    metrics_path: /metrics
    static_configs:
      - targets:
          - catalogo-1:8080
          - catalogo-2:8080
  - job_name: usuarios
    metrics_path: /metrics
    static_configs:
      - targets:
          - usuarios:8080
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8080
