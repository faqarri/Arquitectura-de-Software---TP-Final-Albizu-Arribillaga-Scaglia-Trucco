# Procedimiento único de puesta en marcha: `cp .env.example .env && docker compose up -d --build`
# Infraestructura, mock del contrato y los servicios ya implementados.

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # Usadas por infra/mysql/init/02-usuarios.sh para crear un usuario por servicio.
      CATALOGO_DB_PASSWORD: ${CATALOGO_DB_PASSWORD}
      RESERVAS_DB_PASSWORD: ${RESERVAS_DB_PASSWORD}
      COMPROBANTES_DB_PASSWORD: ${COMPROBANTES_DB_PASSWORD}
      USUARIOS_DB_PASSWORD: ${USUARIOS_DB_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?Definí GRAFANA_DB_PASSWORD en .env}
    # Puerto en tu máquina; cambialo con MYSQL_PUERTO si ya tenés un MySQL instalado en el 3306.
    ports: ["${MYSQL_PUERTO:-3306}:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP (127.0.0.1), no por socket: durante la inicialización MySQL corre un
      # servidor temporal sin red que respondía al ping por socket y hacía arrancar a
      # los servicios antes de tiempo (hallazgo del ensayo en ADR-010).
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      retries: 10
      start_period: 30s

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports: ["5672:5672", "15672:15672"]

  mailpit:
    image: axllent/mailpit:v1.20
    ports: ["1025:1025", "8025:8025"]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4318:4318"]

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      comprobantes: { condition: service_started }

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?Definí GRAFANA_DB_PASSWORD en .env}
    ports: ["3000:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./infra/grafana/provisioning/datasources/mysql.yml:/etc/grafana/provisioning/datasources/mysql.yml:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      prometheus: { condition: service_started }
      comprobantes: { condition: service_healthy }

  comprobantes-mock:
    image: stoplight/prism:5
    # --multiprocess=false: el modo multiproceso (activado por defecto) falla al arrancar en las versiones recientes de la imagen.
    command: mock -h 0.0.0.0 --multiprocess=false /contracts/openapi.yaml
    volumes:
      - ./docs/contracts/comprobantes/v1/openapi.yaml:/contracts/openapi.yaml:ro
    ports: ["4010:4010"]

  # --- Servicios ---
  comprobantes:
    build:
      context: .
      dockerfile: services/comprobantes/Dockerfile
    environment:
      GIN_MODE: release
      PUERTO_HTTP: "8080"
      DB_HOST: mysql
      DB_PUERTO: "3306"
      DB_USUARIO: comprobantes
      DB_PASSWORD: ${COMPROBANTES_DB_PASSWORD}
      DB_NOMBRE: comprobantes
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      # Sin SMTP_* en .env se usa Mailpit; con credenciales, un SMTP real (README de comprobantes).
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PUERTO: ${SMTP_PUERTO:-1025}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_REMITENTE: ${SMTP_REMITENTE:-}
      COMPROBANTES_API_KEYS: ${COMPROBANTES_API_KEYS}
      HABILITAR_ENDPOINT_ERROR_PRUEBA: ${HABILITAR_ENDPOINT_ERROR_PRUEBA:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports: ["8081:8080"]
    restart: on-failure
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_started }
      mailpit: { condition: service_started }
      jaeger: { condition: service_started }

  reservas:
    build:
      context: .
      dockerfile: services/reservas/Dockerfile
    environment:
      GIN_MODE: release
      PUERTO_HTTP: "8080"
      DB_HOST: mysql
      DB_PUERTO: "3306"
      DB_USUARIO: reservas
      DB_PASSWORD: ${RESERVAS_DB_PASSWORD}
      DB_NOMBRE: reservas
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      # Mientras Catálogo no esté en el compose, el mock de su API interna.
      CATALOGO_URL: ${CATALOGO_URL:-http://catalogo-mock:4010}
      # Estudiario (Grupo 2): sin URL pública configurada, el mock de su contrato.
      ESTUDIARIO_URL: ${ESTUDIARIO_URL:-http://estudiario-mock:4010}
      # El mock acepta cualquier clave; para el servicio real va la que entrega el Grupo 2.
      ESTUDIARIO_API_KEY: ${ESTUDIARIO_API_KEY:-clave-para-el-mock}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    # Sin puerto publicado: se accede por el gateway. Para probar sin gateway: 8082.
    ports: ["8082:8080"]
    restart: on-failure
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_started }
      jaeger: { condition: service_started }

  # Mock de la API interna de retenciones de Catálogo (docs/contracts/internos/).
  # Se usa hasta que Catálogo esté implementado.
  catalogo-mock:
    image: stoplight/prism:5
    command: mock -h 0.0.0.0 --multiprocess=false /contracts/catalogo-retenciones.yaml
    volumes:
      - ./docs/contracts/internos/catalogo-retenciones.yaml:/contracts/catalogo-retenciones.yaml:ro
    ports: ["4020:4010"]

  # Mock de la capacidad que consumimos (Estudiario, Grupo 2), con el contrato fijado.
  estudiario-mock:
    image: stoplight/prism:5
    command: mock -h 0.0.0.0 --multiprocess=false /contracts/documents-v1.yaml
    volumes:
      - ./docs/contracts/consumidos/estudiario/1.0.0/documents-v1.yaml:/contracts/documents-v1.yaml:ro
    ports: ["4030:4010"]

  # Frontend (React + Vite) servido por nginx, que deriva /api al gateway.
  # Mientras el gateway no exista usa datos de demostración (FRONTEND_DATOS_FALSOS=false para el gateway).
  frontend:
    build:
      context: ./frontend
      args:
        VITE_DATOS_FALSOS: ${FRONTEND_DATOS_FALSOS:-true}
    environment:
      GATEWAY_URL: ${FRONTEND_GATEWAY_URL:-http://gateway:8080}
    ports: ["5173:80"]

  # --- Servicios que se habilitan a medida que se implementan ---
  # gateway:      { build: ./gateway, ports: ["8080:8080"], env_file: .env }
  # usuarios:     { build: ./services/usuarios, env_file: .env, depends_on: [mysql] }
  # catalogo:     { build: ./services/catalogo, env_file: .env, depends_on: [mongo, mysql, opensearch, rabbitmq] }  # mysql: inventario y retenciones (ADR-014)
  # tiempo-real:  { build: ./services/tiempo-real, env_file: .env, depends_on: [rabbitmq] }  # sin estado, SSE vía gateway (ADR-015)

volumes:
  mysql-data:
  mongo-data:
  prometheus-data:
  grafana-data:
